---
- name: "Install repo {{ ansible_role_name }}"
  ansible.builtin.include_role:
    name: apt_add_repo
  vars:
    apt_add_repo_key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF911AB184317630C59970973E363C90F8F1B6217"
    apt_add_repo_url: "https://ppa.launchpadcontent.net/git-core/ppa/ubuntu {{ ansible_facts['lsb']['codename'] }} main"

- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Ensure git is installed
  ansible.builtin.apt:
    state: present
    pkg:
      - git
      - git-lfs
      - gitk
      - meld
  become: true

- name: "Ensure {{ git_user_dir }}"
  ansible.builtin.file:
    path: "{{ git_user_dir }}"
    state: directory
    mode: "0755"

- name: Copy OS dependent git config
  ansible.builtin.blockinfile:
    backup: true
    path: "{{ ansible_facts['user_dir'] }}/.gitconfig"
    create: true
    insertbefore: BOF
    mode: "0644"
    append_newline: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK git"
    block: "{{ lookup('ansible.builtin.file', 'gitconfig') }}"
  changed_when: false

# Aliases are set by the oh-my-zsh git plugin, so no rc block is kept.
- name: Remove git rc block
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: git
    shell_rc_block_state: absent

- name: Prompt for git user name
  ansible.builtin.pause:
    prompt: "Enter your git user name (press Enter for default {{ git_user_name }}): "
    echo: true
    seconds: 10
  register: git_user_name_input

- name: Use default git user name when user presses Enter
  ansible.builtin.set_fact:
    git_user_name_fact: "{{ (git_user_name_input.user_input | default('') | trim()) or git_user_name }}"

- name: Debug git user name
  ansible.builtin.debug:
    msg: "Using {{ git_user_name_fact }}"

- name: Configure user.name in ~/.gitconfig
  community.general.git_config:
    scope: global
    name: "user.name"
    value: "{{ git_user_name_fact }}"
  changed_when: false

- name: Prompt for git user email
  ansible.builtin.pause:
    prompt: "Enter your git user email (press Enter for default {{ git_user_email }}): "
    echo: true
    seconds: 10
  register: git_user_email_input

- name: Use default git user email when user presses Enter
  ansible.builtin.set_fact:
    git_user_email_fact: "{{ (git_user_email_input.user_input | default('') | trim()) or git_user_email }}"

- name: Debug git user email
  ansible.builtin.debug:
    msg: "Using {{ git_user_email_fact }}"

- name: Configure user.email in ~/.gitconfig
  community.general.git_config:
    scope: global
    name: "user.email"
    value: "{{ git_user_email_fact }}"
  changed_when: false
