---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install git
  community.general.homebrew:
    name:
      - git
      - git-gui # provides gitk
      - git-lfs
    state: present

- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Install meld
  ansible.builtin.apt:
    state: present
    pkg:
      - meld
  become: true

# git used to be installed from the git-core PPA.
- name: Remove git-core PPA
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/config_files-git.sources
    - /usr/share/keyrings/config_files-git.asc
  become: true

- name: "Ensure {{ git_user_dir }}"
  ansible.builtin.file:
    path: "{{ git_user_dir }}"
    state: directory
    mode: "0755"

- name: Copy OS dependent git config
  ansible.builtin.blockinfile:
    backup: true
    path: "{{ ansible_facts['user_dir'] }}/.gitconfig"
    create: true
    insertbefore: BOF
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK git"
    block: "{{ lookup('ansible.builtin.file', 'gitconfig') }}"

# Aliases are set by the oh-my-zsh git plugin, so no rc block is kept.
- name: Remove git rc block
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: git
    shell_rc_block_state: absent

# The user is only asked for name and email when they are not configured yet.
- name: Read configured git user
  ansible.builtin.command:
    argv:
      - "{{ homebrew_bin_path }}/git"
      - config
      - --global
      - --get
      - "user.{{ item }}"
  loop:
    - name
    - email
  register: git_user_configured
  changed_when: false
  failed_when: git_user_configured.rc not in [0, 1]

- name: Prompt for git user name
  ansible.builtin.pause:
    prompt: "Enter your git user name (press Enter for default {{ git_user_name }}): "
    echo: true
    seconds: 10
  register: git_user_name_input
  when: git_user_configured.results[0].stdout | length == 0

- name: Configure user.name in ~/.gitconfig
  community.general.git_config:
    scope: global
    name: user.name
    value: "{{ (git_user_name_input.user_input | default('') | trim) or git_user_name }}"
  when: git_user_configured.results[0].stdout | length == 0

- name: Prompt for git user email
  ansible.builtin.pause:
    prompt: "Enter your git user email (press Enter for default {{ git_user_email }}): "
    echo: true
    seconds: 10
  register: git_user_email_input
  when: git_user_configured.results[1].stdout | length == 0

- name: Configure user.email in ~/.gitconfig
  community.general.git_config:
    scope: global
    name: user.email
    value: "{{ (git_user_email_input.user_input | default('') | trim) or git_user_email }}"
  when: git_user_configured.results[1].stdout | length == 0
