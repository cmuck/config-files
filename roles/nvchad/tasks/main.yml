---
- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Install git and vim
  ansible.builtin.apt:
    state: present
    pkg:
      - git
      - vim
  become: true

- name: Include nvim
  ansible.builtin.include_role:
    name: nvim

- name: Install ripgrep
  community.general.homebrew:
    name: ripgrep
    state: present

# An existing nvim config is never touched, so local customizations survive.
- name: Check nvim config directory
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.config/nvim"
  register: nvchad_config_dir

- name: Install NvChad from https://nvchad.com/ # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/NvChad/starter
    dest: "{{ ansible_facts['user_dir'] }}/.config/nvim"
    depth: 1
  when: not nvchad_config_dir.stat.exists
