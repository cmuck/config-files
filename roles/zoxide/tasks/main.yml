---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install zoxide
  community.general.homebrew:
    name: zoxide
    state: present

- name: Add zoxide shell init
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: zoxide
    shell_rc_block_content: |
      eval "$(zoxide init {{ shell_rc_block_target.shell }})"
