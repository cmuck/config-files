---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

# Bitwarden used to be installed from the GitHub deb package.
- name: Remove Bitwarden deb package
  ansible.builtin.apt:
    name: bitwarden
    state: absent
  become: true

- name: Install Bitwarden
  community.general.homebrew_cask:
    name: bitwarden
    path: "{{ homebrew_bin_path }}"
    state: present
