---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install Ubuntu Mono Nerd Font
  community.general.homebrew_cask:
    name: font-ubuntu-mono-nerd-font
    path: "{{ homebrew_bin_path }}"
    state: present
  register: nerdfonts_cask

# The fonts used to be unarchived from the GitHub release into ~/.fonts.
- name: Find downloaded Nerd Fonts
  ansible.builtin.find:
    paths: "{{ ansible_facts['user_dir'] }}/.fonts"
    patterns: UbuntuMonoNerdFont*
  register: nerdfonts_legacy

- name: Remove downloaded Nerd Fonts
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ nerdfonts_legacy.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Install fc-cache
  ansible.builtin.apt:
    state: present
    pkg:
      - fontconfig
  become: true

- name: Build font information cache files
  ansible.builtin.command: fc-cache -f
  when: nerdfonts_cask.changed or nerdfonts_legacy.matched > 0
  changed_when: true
