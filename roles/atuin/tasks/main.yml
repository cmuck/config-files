---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install Atuin
  community.general.homebrew:
    name: atuin
    state: present

- name: Add Atuin shell init
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: atuin
    shell_rc_block_content: |
      eval "$(atuin init zsh)"

- name: Ensure Atuin config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/atuin"
    state: directory
    mode: "0700"

- name: Write Atuin config
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ ansible_facts['user_dir'] }}/.config/atuin/config.toml"
    mode: "0600"
