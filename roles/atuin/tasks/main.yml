---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install Atuin
  community.general.homebrew:
    name: atuin
    state: present

- name: Add Atuin shell init
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: atuin
    shell_rc_block_content: |
      if [ -e "$HOME/.atuin/bin/env" ]; then
        . "$HOME/.atuin/bin/env"
      fi
      eval "$(atuin init {{ shell_rc_block_target.shell }})"

- name: Ensure Atuin config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/atuin"
    state: directory
    mode: "0700"

- name: Copy config.toml to Atuin config directory
  ansible.builtin.copy:
    src: config.toml
    dest: "{{ ansible_facts['user_dir'] }}/.config/atuin/config.toml"
    mode: "0600"
