---
# yamllint disable rule:line-length
- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Install zsh dependencies
  ansible.builtin.apt:
    state: present
    pkg:
      - curl
      - git
      - zsh
  become: true

- name: Write .zshrc based on template
  ansible.builtin.blockinfile:
    backup: true
    create: true
    path: "{{ ansible_facts['user_dir'] }}/.zshrc"
    insertbefore: BOF
    mode: "0600"
    append_newline: true
    block: "{{ lookup('ansible.builtin.template', 'zshrc.j2') }}"

# Included after the zshrc block, so the brew shellenv block is placed above it.
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install fzf
  community.general.homebrew:
    name: fzf
    state: present

- name: Add shell aliases
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: aliases
    shell_rc_block_content: |
      alias alert='notify-send --urgency=low -i "$([ $? = 0 ] && echo terminal || echo error)" "$(history|tail -n1|sed -e '\''s/^\s*[0-9]\+\s*//;s/[;&|]\s*alert$//'\'')"'
      alias df='df -h'
      alias e='exit'
      alias free='free -m'
      alias hy='fc -ln 0 | awk "!a[\$0]++" | fzf --tac | xclip -selection clipboard'
      alias gh-create='gh repo create --private --source=. --remote=origin && git push -u --all && gh browse'

- name: Clone oh-my-zsh # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/robbyrussell/oh-my-zsh.git
    dest: "{{ zsh_oh_my_zsh_dir }}"

- name: Clone zsh-autosuggestions plugin to oh-my-zsh directory
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    version: v0.7.1
    dest: "{{ zsh_oh_my_zsh_dir }}/custom/plugins/zsh-autosuggestions"
    depth: 1

- name: Clone zsh-syntax-highlighting plugin oh-my-zsh directory
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    version: "0.7.1"
    dest: "{{ zsh_oh_my_zsh_dir }}/custom/plugins/zsh-syntax-highlighting"
    depth: 1

- name: Clone fzf-tab plugin oh-my-zsh directory # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/Aloxaf/fzf-tab.git
    dest: "{{ zsh_oh_my_zsh_dir }}/custom/plugins/fzf-tab"
    depth: 1

- name: Write block in file to .profile
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.profile"
    append_newline: true
    prepend_newline: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK profile_zsh_block sourcing"
    block: "{{ lookup('ansible.builtin.file', 'profile_block') }}"

- name: Create symbolic link .zprofile
  ansible.builtin.file:
    src: "{{ ansible_facts['user_dir'] }}/.profile"
    dest: "{{ ansible_facts['user_dir'] }}/.zprofile"
    state: link

# Only local users can get their shell changed by the user module, e.g. no LDAP users.
- name: Look up user in /etc/passwd
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_facts['user_id'] }}"
    service: files
    fail_key: false

- name: Set default shell for users
  when: ansible_facts['getent_passwd'][ansible_facts['user_id']] is not none
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
  become: true

- name: Clean up old installation paths
  ansible.builtin.include_tasks: delete_dir.yml
  loop:
    - "{{ ansible_facts['user_dir'] }}/.fzf"
    - "{{ ansible_facts['user_dir'] }}/.local/share/fzf"
    - "{{ ansible_facts['user_dir'] }}/.oh-my-zsh"
    - "{{ ansible_facts['user_dir'] }}/.config/zsh"
    - "{{ ansible_facts['user_dir'] }}/.local/share/zsh"
