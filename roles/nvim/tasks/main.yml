---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install neovim
  community.general.homebrew:
    name: neovim
    state: present

- name: Add nvim aliases
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: nvim
    shell_rc_block_content: |
      command -v nvim >/dev/null && alias vim='nvim' vimdiff='nvim -d' n='nvim'
