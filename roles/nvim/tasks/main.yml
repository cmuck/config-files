---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install neovim
  community.general.homebrew:
    name: neovim
    state: present

# Absolute path, so sudoedit and crontab -e find nvim without Homebrew in PATH.
- name: Add nvim editor and aliases
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: nvim
    shell_rc_block_content: |
      export EDITOR="{{ homebrew_bin_path }}/nvim"
      command -v nvim >/dev/null && alias vim='nvim' vimdiff='nvim -d' n='nvim'
