---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install Krew
  community.general.homebrew:
    name: krew
    state: present

# Krew used to install itself as krew plugin into ~/.krew, which would shadow the Homebrew binary.
- name: Remove self-installed Krew
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.krew/{{ item }}"
    state: absent
  loop:
    - bin/kubectl-krew
    - receipts/krew.yaml
    - store/krew

# Plugins installed by Krew are still linked into ~/.krew/bin.
- name: Add Krew plugins to PATH
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: krew
    shell_rc_block_content: |
      export PATH="${KREW_ROOT:-$HOME/.krew}/bin:$PATH"
