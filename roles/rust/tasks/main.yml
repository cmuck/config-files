---
- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Install rust dependencies
  ansible.builtin.apt:
    state: present
    pkg:
      - build-essential
      - curl
  become: true

- name: Download installer
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: /tmp/sh.rustup.rs
    mode: "0755"

- name: Install rust and cargo
  ansible.builtin.command: /tmp/sh.rustup.rs -y --no-modify-path
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.cargo/bin/rustup"

- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install cargo-binstall
  community.general.homebrew:
    name: cargo-binstall
    state: present

# cargo-binstall used to be installed by its install script.
- name: Remove script-installed cargo-binstall
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.cargo/bin/cargo-binstall"
    state: absent

- name: Write block in file to .profile
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.profile"
    append_newline: true
    prepend_newline: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK profile_rust_block sourcing"
    block: "{{ lookup('ansible.builtin.file', 'profile_rust_block') }}"
