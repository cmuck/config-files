---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install starship
  community.general.homebrew:
    name: starship
    state: present

# The init is set by the oh-my-zsh starship plugin, so no rc block is kept.
- name: Remove starship rc block
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: starship
    shell_rc_block_state: absent
