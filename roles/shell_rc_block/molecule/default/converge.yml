---
- name: Converge
  hosts: all
  tasks:
    - name: Add a block
      ansible.builtin.include_role:
        name: shell_rc_block
      vars:
        shell_rc_block_name: molecule_added
        shell_rc_block_content: echo "molecule added"

    - name: Remove the stale block
      ansible.builtin.include_role:
        name: shell_rc_block
      vars:
        shell_rc_block_name: molecule_removed
        shell_rc_block_state: absent
  environment: "{{ proxy_environment }}"
