---
- name: Verify
  hosts: all
  tasks:
    - name: Read rc file
      ansible.builtin.slurp:
        src: "{{ ansible_facts['user_dir'] }}/.zshrc"
      register: shell_rc_block_verify_file

    - name: Assert block is added and removed block is gone
      ansible.builtin.assert:
        that:
          - '"echo \"molecule added\"" in (shell_rc_block_verify_file.content | b64decode)'
          - "'molecule_removed' not in (shell_rc_block_verify_file.content | b64decode)"
