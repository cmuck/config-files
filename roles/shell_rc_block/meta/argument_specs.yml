---
argument_specs:
  main:
    short_description: Manage a marker-delimited block in the zsh rc file
    description:
      - Adds or removes one ANSIBLE MANAGED BLOCK in C(shell_rc_block_path).
    options:
      shell_rc_block_name:
        description: Block name, used in the begin/end markers.
        type: str
        required: true
      shell_rc_block_content:
        description: Block text. Not needed for state C(absent).
        type: str
      shell_rc_block_state:
        description: Whether the block shall be present or absent.
        type: str
        choices: [present, absent]
      shell_rc_block_insertbefore:
        description: Passed to blockinfile as C(insertbefore), e.g. C(BOF). Default is to append to the file.
        type: str
      shell_rc_block_path:
        description: Absolute path of the rc file.
        type: str
