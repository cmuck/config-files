---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install eza
  community.general.homebrew:
    name: eza
    state: present

# Aliases are set by the oh-my-zsh eza plugin, so no rc block is kept.
- name: Remove eza rc block
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: eza
    shell_rc_block_state: absent

- name: Remove old exa rc block
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: exa
    shell_rc_block_state: absent
