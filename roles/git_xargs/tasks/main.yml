---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install git-xargs
  community.general.homebrew:
    name: git-xargs
    state: present

# git-xargs used to be downloaded from the GitHub release.
- name: Remove downloaded git-xargs binary
  ansible.builtin.file:
    path: /usr/local/bin/git-xargs
    state: absent
  become: true
