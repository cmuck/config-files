---
- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Ensure CLI apps present
  ansible.builtin.apt:
    state: present
    pkg:
      - autofs
      - build-essential
      - cifs-utils
      - curl
      - htop
      - iftop
      - iotop
      - iperf3
      - ncdu
      - nmap
      - openconnect
      - ripgrep
      - safe-rm
      - shellcheck
      - trash-cli
      - vim
  become: true

- name: Ensure CLI apps absent
  ansible.builtin.apt:
    state: absent
    pkg:
      - direnv # installed by the direnv role via Homebrew
      - pipx
      - silversearcher-ag
  become: true

- name: Check if uv is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/uv"
  register: ensure_apps_cli_uv_bin

- name: Install Python tools
  when: ensure_apps_cli_uv_bin.stat.exists
  ansible.builtin.command:
    argv:
      - "{{ ensure_apps_cli_uv_bin.stat.path }}"
      - tool
      - install
      - "{{ item }}"
  loop:
    - aws-shell
    - cookiecutter
    - poetry
    - tldr
  register: ensure_apps_cli_uv_install
  changed_when: "'is already installed' not in ensure_apps_cli_uv_install.stderr"
