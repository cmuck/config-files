---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install yazi
  community.general.homebrew:
    name: yazi
    state: present

- name: Add yazi shell wrapper
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: yazi
    shell_rc_block_content: |
      function y() {
        local tmp="$(mktemp -t "yazi-cwd.XXXXXX")" cwd
        yazi "$@" --cwd-file="$tmp"
        if cwd="$(command cat -- "$tmp")" && [ -n "$cwd" ] && [ "$cwd" != "$PWD" ]; then
          builtin cd -- "$cwd"
        fi
        rm -f -- "$tmp"
      }
