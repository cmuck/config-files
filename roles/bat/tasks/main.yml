---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install bat
  community.general.homebrew:
    name: bat
    state: present

- name: Add bat alias
  ansible.builtin.include_role:
    name: shell_rc_block
  vars:
    shell_rc_block_name: bat
    shell_rc_block_content: |
      command -v bat >/dev/null && alias bc="bat"
      command -v batcat >/dev/null && alias bc="batcat"
