---
- name: Check latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest
  register: obsidian_latest

- name: Create Applications directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Applications"
    state: directory
    mode: "0755"

# Asset names: Obsidian-<version>.AppImage (x86_64) and Obsidian-<version>-arm64.AppImage
- name: Download latest Obsidian AppImage
  ansible.builtin.get_url:
    url: "{{ obsidian_latest.json.assets | map(attribute='browser_download_url') | select('search', obsidian_appimage_regex) | first }}"
    dest: "{{ ansible_facts['user_dir'] }}/Applications/Obsidian.AppImage"
    mode: "0755"
    force: true
  vars:
    obsidian_appimage_regex: "{{ '-arm64\\.AppImage$' if ansible_facts['architecture'] == 'aarch64' else '-[0-9.]+\\.AppImage$' }}"
