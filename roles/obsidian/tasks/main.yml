---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Check Obsidian cask
  ansible.builtin.command:
    argv:
      - "{{ homebrew_binary }}"
      - list
      - --cask
      - obsidian
  register: obsidian_cask_installed
  changed_when: false
  failed_when: false

# The AppImage used to be downloaded to the same path the cask installs to.
- name: Remove downloaded Obsidian AppImage
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Applications/Obsidian.AppImage"
    state: absent
  when: obsidian_cask_installed.rc != 0

- name: Install Obsidian
  community.general.homebrew_cask:
    name: obsidian
    path: "{{ homebrew_bin_path }}"
    state: present
