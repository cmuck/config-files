---
- name: Include brew role
  ansible.builtin.include_role:
    name: brew

- name: Install nvm
  community.general.homebrew:
    name:
      - git
      - nvm
    state: present

- name: Create nvm directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.nvm"
    state: directory
    mode: "0755"

- name: Write block in file to rc files
  ansible.builtin.blockinfile:
    backup: true
    path: "{{ item }}"
    create: true
    mode: "0600"
    append_newline: true
    prepend_newline: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK nvm"
    block: |
      export NVM_DIR="$HOME/.nvm"
      # Sourcing nvm.sh costs ~1s, so load it on first use of nvm/node/npm/npx
      _nvm_lazy() {
        unset -f nvm node npm npx
        \. "{{ homebrew_prefix }}/opt/nvm/nvm.sh"
        [ -n "$BASH_VERSION" ] && [ -s "{{ homebrew_prefix }}/opt/nvm/etc/bash_completion.d/nvm" ] \
          && \. "{{ homebrew_prefix }}/opt/nvm/etc/bash_completion.d/nvm"
        "$@"
      }
      for _nvm_cmd in nvm node npm npx; do
        eval "$_nvm_cmd() { _nvm_lazy $_nvm_cmd \"\$@\"; }"
      done
      unset _nvm_cmd
  with_items:
    - "{{ ansible_facts['user_dir'] }}/.zshrc"
    - "{{ ansible_facts['user_dir'] }}/.bashrc"
