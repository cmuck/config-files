---
- name: Include apt_update role
  ansible.builtin.include_role:
    name: apt_update

- name: Install dependencies
  ansible.builtin.apt:
    state: present
    pkg:
      - curl
      - dconf-cli
      - git
      - gnome-terminal
      - meld
      - uuid-runtime
  become: true

- name: Clone gogh directory # noqa latest[git]
  ansible.builtin.git:
    repo: https://github.com/Gogh-Co/Gogh.git
    dest: /tmp/gogh
    depth: 1

# Gogh skips a theme whose terminal profile already exists.
- name: Install themes
  ansible.builtin.command: ./{{ item }}
  args:
    chdir: /tmp/gogh/installs
  register: gogh_theme
  changed_when: "'Profile already exists' not in gogh_theme.stdout"
  environment:
    TERMINAL: gnome-terminal
  loop:
    - catppuccin-macchiato.sh
    - cobalt-neon.sh
    - dracula.sh
