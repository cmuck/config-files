---
- name: Check latest version
  ansible.builtin.uri:
    url: https://api.github.com/repos/nextcloud-releases/desktop/releases/latest
  register: nextcloud_latest

- name: Create Applications directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Applications"
    state: directory
    mode: "0755"

# Asset name: Nextcloud-<version>-<architecture>.AppImage
- name: Download latest Nextcloud AppImage
  ansible.builtin.get_url:
    url: "{{ nextcloud_latest.json.assets | map(attribute='browser_download_url') | select('search', nextcloud_appimage_regex) | first }}"
    dest: "{{ ansible_facts['user_dir'] }}/Applications/Nextcloud.AppImage"
    mode: "0755"
    force: true
  vars:
    nextcloud_appimage_regex: "-{{ ansible_facts['architecture'] }}\\.AppImage$"
